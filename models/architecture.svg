<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Arial,Helvetica,sans-serif">
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="38" text-anchor="middle" font-size="19" font-weight="bold" fill="#111">Anatomy of the MACE potential</text>
  <g>
    <rect x="40"  y="70" width="272" height="130" rx="8" fill="#f2f2f2" stroke="#333"/>
    <rect x="344" y="70" width="272" height="130" rx="8" fill="#f2f2f2" stroke="#333"/>
    <rect x="648" y="70" width="272" height="130" rx="8" fill="#f2f2f2" stroke="#333"/>
    <rect x="40"  y="220" width="272" height="130" rx="8" fill="#f2f2f2" stroke="#333"/>
    <rect x="344" y="220" width="272" height="130" rx="8" fill="#f2f2f2" stroke="#333"/>
    <rect x="648" y="220" width="272" height="130" rx="8" fill="#e2e2e2" stroke="#111" stroke-width="1.8"/>
  </g>
  <g fill="#111">
    <text x="60" y="98"  font-size="14" font-weight="bold">1 &#183; Local environments</text>
    <text x="60" y="120" font-size="12">neighbours within r_max = 6 &#8491;</text>
    <text x="60" y="138" font-size="12">(~40&#8211;80 per atom in these boxes)</text>
    <text x="60" y="156" font-size="12">positions &#8594; edge vectors r_ij</text>
    <text x="364" y="98"  font-size="14" font-weight="bold">2 &#183; Equivariant embedding</text>
    <text x="364" y="120" font-size="12">radial basis &#215; spherical harmonics</text>
    <text x="364" y="138" font-size="12">rotation/translation symmetry exact</text>
    <text x="364" y="156" font-size="12">by construction &#8212; never learned</text>
    <text x="668" y="98"  font-size="14" font-weight="bold">3 &#183; Message passing &#215;2</text>
    <text x="668" y="120" font-size="12">features updated from neighbours</text>
    <text x="668" y="138" font-size="12">via equivariant tensor products</text>
    <text x="668" y="156" font-size="12">effective reach ~12 &#8491;</text>
    <text x="60" y="248" font-size="14" font-weight="bold">4 &#183; Higher-order messages</text>
    <text x="60" y="270" font-size="12">ACE body-order expansion:</text>
    <text x="60" y="288" font-size="12">3-/4-body terms in a single layer</text>
    <text x="60" y="306" font-size="12">&#8594; accurate AND shallow (= fast)</text>
    <text x="364" y="248" font-size="14" font-weight="bold">5 &#183; Readout</text>
    <text x="364" y="270" font-size="12">E = &#931;&#949;_i + &#931;E0 (fitted/atomic refs)</text>
    <text x="364" y="288" font-size="12">F = &#8722;&#8706;E/&#8706;r &#8212; exact autograd,</text>
    <text x="364" y="306" font-size="12">so E&#8211;F consistency is testable</text>
    <text x="668" y="248" font-size="14" font-weight="bold">Result</text>
    <text x="668" y="270" font-size="12">hybrid-DFT (or LDA) physics</text>
    <text x="668" y="288" font-size="12">at classical-potential cost:</text>
    <text x="668" y="306" font-size="12">60 ps &#215; 192 atoms in ~2 GPU-h</text>
  </g>
  <rect x="40" y="380" width="880" height="80" rx="8" fill="none" stroke="#333" stroke-dasharray="6,4"/>
  <text x="480" y="406" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">Fine-tuning: start from mace-mpa-0-medium, nudge with ~1100 labels at your functional</text>
  <text x="480" y="426" text-anchor="middle" font-size="12" fill="#111">v4: revPBE0-D3, 1193 configs &#183; lda_v1: LDA/PADE, 1080 configs &#183; dipole_v2: MLWF dipole labels</text>
  <text x="480" y="446" text-anchor="middle" font-size="12" fill="#111">a learned correction, not water from scratch &#8212; apply at T &#8804; 3000 K in the trained envelope</text>
  <text x="480" y="510" text-anchor="middle" font-size="11" fill="#333">validations: invariances &#8594; 2 &#183; parity + E&#8211;F consistency &#8594; 5 &#183; EOS &#183; finite size &#8594; 1+3 &#183; learning curve &#8594; fine-tuning</text>
</svg>
