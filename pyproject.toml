[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "subneptune"
version = "0.1.0"
description = "Steam-envelope sub-Neptune interior structure & evolution"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Harry Taylor" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pyyaml>=6.0",  # config parsing only (see AMENDMENTS.md A1)
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
py-modules = ["constants"]
packages = [
    "config",
    "eos",
    "opacity",
    "structure",
    "evolution",
    "validation",
    "figures",
]

[tool.pytest.ini_options]
testpaths = ["validation"]
